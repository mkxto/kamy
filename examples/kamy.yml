version: 1.0.0
module_settings:
  import_protection: false
  obscure_entry_point: false
  injection:
    enabled: false
    mode: init-table
    plugins: []

profiles:
- name: default
  passes:
  - type: MixedBooleanArithmetic
    iterations: 1
    probability: 100
    semantics: { add: true, sub: true, xor: true }
    bitwidths: { bit8: true, bit16: true, bit32: true, bit64: true }
  symbols:
  - !Pattern "crypto_*"
  - !Name main
