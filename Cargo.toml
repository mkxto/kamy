[workspace]
resolver = "2"
members = ["crates/*", "tests/sdk-rebuild"]
exclude = ["tools/win32cc-gen"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
repository = "https://github.com/mkxto/kamy"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Internal crates
kamy-core = { path = "crates/kamy-core", version = "0.0.0" }
kamy-pe = { path = "crates/kamy-pe", version = "0.0.0" }
kamy-disasm = { path = "crates/kamy-disasm", version = "0.0.0" }
kamy-lift = { path = "crates/kamy-lift", version = "0.0.0" }
kamy-analysis = { path = "crates/kamy-analysis", version = "0.0.0" }
kamy-transforms = { path = "crates/kamy-transforms", version = "0.0.0" }
kamy-codegen = { path = "crates/kamy-codegen", version = "0.0.0" }
kamy-link = { path = "crates/kamy-link", version = "0.0.0" }
kamy-seh = { path = "crates/kamy-seh", version = "0.0.0" }
kamy-verify = { path = "crates/kamy-verify", version = "0.0.0" }
kamy-config = { path = "crates/kamy-config", version = "0.0.0" }
kamy-observe = { path = "crates/kamy-observe", version = "0.0.0" }
kamy-corpus = { path = "crates/kamy-corpus", version = "0.0.0" }
kamy-run = { path = "crates/kamy-run", version = "0.0.0" }
kamy-triage = { path = "crates/kamy-triage", version = "0.0.0" }
kamy-pdb = { path = "crates/kamy-pdb", version = "0.0.0" }
kamy-sdk = { path = "crates/kamy-sdk", version = "0.0.0" }

# External crates
iced-x86 = "1.21.0"
object = { version = "0.40", default-features = false, features = ["read_core", "std", "coff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
serde_json = "1.0.154"
csv = "1.3"
rayon = "1.12.0"
anyhow = "1.0.104"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "ansi", "json"] }
tracing-tree = "0.4.0"
clap = { version = "4.6.7", features = ["derive"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
petgraph = "0.6.5"
pdb = "0.8.0"
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }
