[package]
name = "win32cc-gen"
version = "0.0.0"
edition = "2021"
publish = false

# Offline dev tool (grilling D14): reads Windows.Win32.winmd and emits the
# compact call-conv blob consumed by kamy-core. Deliberately excluded from the
# workspace so the shipping crates and CI build carry no windows-metadata
# dependency. Run on demand to regenerate the committed table.

[dependencies]
windows-metadata = "0.100"
anyhow = "1"
